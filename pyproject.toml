[project]
name = "sih"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sumitexists", email = "sumitsingh290707@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "deepface>=0.0.93",
    "easyocr>=1.7.1",
    "fastapi>=0.111.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26.4",
    "opencv-python-headless>=4.9.0.80",
    "passporteye>=2.2.1",
    "pikepdf>=8.15.1",
    "pillow>=10.3.0",
    "pytesseract>=0.3.10",
    "pytest>=8.0.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.4.2",
    "tf-keras>=2.16.0",
    "uvicorn[standard]>=0.29.0",
]

[project.scripts]
sih = "sih:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
